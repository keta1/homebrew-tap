name: Bump packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check for updates without creating pull requests
        type: boolean
        default: false
  schedule:
    - cron: "23 1 * * *" # Daily at 09:23 Asia/Singapore.

permissions:
  contents: read

concurrency:
  group: bump-packages
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'keta1/homebrew-tap' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_DEVELOPER: "1"

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c722b5d961eb7f3ebec81ec2e5584faf7c3cff5d # main
        with:
          token: ${{ steps.app-token.outputs.token }}
          brew-gh-api-token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        uses: Homebrew/actions/git-user-config@c722b5d961eb7f3ebec81ec2e5584faf7c3cff5d # main
        with:
          token: ${{ steps.app-token.outputs.token }}
          username: ${{ steps.app-token.outputs.app-slug }}[bot]

      - name: Check for updates and open PRs
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=(--tap=keta1/tap --no-fork)
          if [[ "$DRY_RUN" != 'true' ]]; then
            args+=(--open-pr)
          fi
          brew bump "${args[@]}"
